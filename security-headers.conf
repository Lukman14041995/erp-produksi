# Included both at server level and inside every location that declares its
# own add_header (assets/, favicon, index.html) -- nginx's add_header does
# NOT merge across nesting levels: a location with any add_header of its own
# silently drops all headers inherited from its parent, so these lines must
# be repeated verbatim in each such location rather than relied upon from
# the server block alone. (Verified: without this, curl -I on any actual
# page load returned zero of these headers, because SPA fallback routes
# every request through the /index.html location internally.)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
