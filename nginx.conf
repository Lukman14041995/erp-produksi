# Served as /etc/nginx/conf.d/default.conf inside the frontend image.
# Single origin for the SPA + API in production: this server serves the
# built React app and reverse-proxies /api/v1 straight to the backend
# container, so the browser never makes a cross-origin request.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Applies to every location below that has no add_header of its own
    # (api/v1, health, and the try_files catch-all before it internally
    # redirects). Locations that set their own Cache-Control re-include
    # this same file, since add_header doesn't inherit once a location
    # defines any add_header at all -- see security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Static asset caching ----
    # Vite content-hashes everything under /assets, so it's safe to cache
    # aggressively -- a new deploy ships new filenames, never stale content.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must always be revalidated, otherwise browsers could cache
    # a stale shell that references assets from a previous deploy. This is
    # also where every SPA-fallback request actually lands (see try_files
    # below), so it's the one that matters most for the security headers.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---- API reverse proxy ----
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    # Design sample photos, served by the backend from local disk (see
    # e.Static("/uploads", ...) in cmd/api/main.go) and proxied through here
    # so the browser only ever talks to this one origin.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- SPA fallback ----
    # Any route not matched above (client-side React Router paths) falls
    # back to index.html so a hard refresh on e.g. /sales/orders/123 works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
